# 示例：复制到 /etc/nginx/sites-available/ 后按需改 server_name，再 ln -s 到 sites-enabled
# 假设静态文件已通过 deploy-my-server.cmd 上传到 /var/www/bi-dashboard

server {
    listen 80;
    server_name _;   # 改成你的域名或公网 IP

    root /var/www/bi-dashboard;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 缓存带 hash 的静态资源（可选）
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
